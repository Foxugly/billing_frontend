# Console de facturation Foxugly (SPA Angular) — vhost nginx pour billing.foxugly.com.
#
# TLS : certificat WILDCARD *.foxugly.com partagé (DNS-01), référencé directement —
# jamais de certbot par sous-domaine (§3.6). La configuration d'exécution vient de
# SSM via le snippet inclus plus bas (écrit par fetch-frontend-runtime-from-ssm.sh)
# et est injectée dans index.html sous `window.__BILLING__`, lue par
# core/runtime-config.ts. La SPA appelle billing-api.foxugly.com en cross-origin.
#
# Forme `listen ... http2` : la box est en nginx 1.24, où `http2 on;` n'existe pas
# encore et ferait échouer `nginx -t`.

server {
    listen 80;
    server_name billing.foxugly.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name billing.foxugly.com;

    ssl_certificate     /etc/letsencrypt/live/foxugly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foxugly.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/django_websites/billing_frontend/dist/billing-frontend/browser;
    index index.html;

    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Valeurs par défaut vides pour que la page démarre avant le premier fetch SSM ;
    # le snippet écrit par le script les remplace.
    set $billing_api_base       "";
    set $billing_sentry_dsn     "";
    set $billing_sentry_env     "production";
    set $billing_version        "";
    set $billing_csp_report     "";   # "; report-uri <sentry>" écrit par le script
    include /etc/nginx/snippets/billing-frontend-runtime*.conf;   # le glob tolère l'absence

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control             "no-store, no-cache, must-revalidate" always;
        expires 0;

        # CSP à nonce (build AOT ⇒ ni unsafe-inline ni eval). Le seul script inline
        # est le bloc de configuration ci-dessous, qui porte $request_id comme nonce.
        # `frame-ancestors 'none'` : une console d'administration n'a aucune raison
        # d'être encadrée. `inlineCritical` est désactivé au build, donc aucun
        # handler onload inline à autoriser.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://billing-api.foxugly.com https://*.ingest.de.sentry.io; worker-src 'self' blob:$billing_csp_report" always;

        gzip on;
        # Le script anti-FOUC d'index.html est inline : sans nonce, la CSP le
        # bloque et le theme sombre flashe en clair a chaque rechargement.
        # Il porte data-theme-init pour etre cible sans ambiguite. ATTENTION :
        # le build Angular normalise l'attribut en data-theme-init="" — sub_filter
        # compare des chaines litterales, donc la forme sans ="" ne matche RIEN.
        sub_filter '<script data-theme-init="">' '<script nonce="$request_id">';
        sub_filter '</head>' '<script nonce="$request_id">window.__BILLING__={apiBaseUrl:"$billing_api_base",sentryDsn:"$billing_sentry_dsn",sentryEnv:"$billing_sentry_env",version:"$billing_version"};</script></head>';
        sub_filter_once on;
    }

    # Les catalogues i18n ne sont PAS hashés → ne jamais servir de version périmée.
    location ~* ^/i18n/.+\.json$ {
        add_header Cache-Control "no-cache" always;
        etag on;
        try_files $uri =404;
    }

    # Bundles hashés : cache long immuable.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    access_log /var/log/nginx/billing-frontend-access.log;
    error_log  /var/log/nginx/billing-frontend-error.log;
}
