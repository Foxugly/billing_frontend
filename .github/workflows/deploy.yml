name: Test & Deploy

on:
  push:
    branches: [main]
  # Pas de filtre de branche cible : une PR empilée sur une autre PR doit être
  # testée elle aussi, sinon elle passerait pour verte sans l'être.
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Tests unitaires (Vitest)
        run: npm test
      - name: Build (valide la compilation)
        run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # émet le jeton OIDC pour assumer le rôle de déploiement
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Vérifier la sortie du build
        run: test -f dist/billing-frontend/browser/index.html

      - name: Empaqueter le bundle
        id: pkg
        run: |
          tar -czf frontend-build.tar.gz -C dist/billing-frontend/browser .
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(git rev-parse --short HEAD) ($(date -u +%Y-%m-%d))" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: gh-actions-${{ github.run_id }}

      - name: Envoyer le bundle sur S3
        run: |
          aws s3 cp frontend-build.tar.gz \
            "s3://${{ secrets.S3_DEPLOY_BUCKET }}/builds/billing-frontend/${{ steps.pkg.outputs.sha }}.tar.gz"

      - name: Déployer sur l'EC2 via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          BUCKET: ${{ secrets.S3_DEPLOY_BUCKET }}
          SHA: ${{ steps.pkg.outputs.sha }}
          FE_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          # AWS-RunShellScript tourne en ROOT. Installe la configuration depuis le
          # BLOB GIT COMMITÉ (jamais l'arbre django, §3.10), récupère le bundle S3
          # via le rôle d'instance (clés certbot neutralisées), échange le docroot,
          # lance le runtime-fetch puis recharge nginx.
          APP=/var/www/django_websites/billing_frontend
          DOC="$APP/dist/billing-frontend/browser"
          GB="git -C $APP -c safe.directory=$APP show origin/main"
          cat > /tmp/ssm-params.json <<EOF
          { "commands": [
            "chown -R django:www-data $APP",
            "sudo -u django bash -c 'umask 027; cd $APP && git fetch --quiet origin main && git reset --hard --quiet origin/main'",
            "$GB:deploy/systemd/billing-frontend-runtime-fetch.service > /etc/systemd/system/billing-frontend-runtime-fetch.service",
            "$GB:deploy/fetch-frontend-runtime-from-ssm.sh > /usr/local/sbin/billing-frontend-runtime-fetch.sh && chmod 0755 /usr/local/sbin/billing-frontend-runtime-fetch.sh && chown root:root /usr/local/sbin/billing-frontend-runtime-fetch.sh",
            "$GB:deploy/nginx/billing-frontend.conf > /etc/nginx/sites-available/billing-frontend.conf && ln -sf /etc/nginx/sites-available/billing-frontend.conf /etc/nginx/sites-enabled/billing-frontend.conf",
            "systemctl daemon-reload && systemctl enable --quiet billing-frontend-runtime-fetch",
            "env AWS_SHARED_CREDENTIALS_FILE=/dev/null AWS_CONFIG_FILE=/dev/null aws s3 cp s3://$BUCKET/builds/billing-frontend/$SHA.tar.gz /tmp/billingfe.tar.gz --region eu-west-1",
            "rm -rf /tmp/billingfe && mkdir -p /tmp/billingfe && tar -xzf /tmp/billingfe.tar.gz -C /tmp/billingfe",
            "rm -rf $APP/dist/.bundle-prev; [ -d $APP/dist/.bundle-current ] && mv $APP/dist/.bundle-current $APP/dist/.bundle-prev || true",
            "rm -rf $APP/dist/.bundle-current && cp -a /tmp/billingfe $APP/dist/.bundle-current",
            "mkdir -p $DOC && rsync -a --delete $APP/dist/.bundle-current/ $DOC/",
            "[ -d $APP/dist/.bundle-prev ] && rsync -a --ignore-existing $APP/dist/.bundle-prev/ $DOC/ || true",
            "rm -rf /tmp/billingfe /tmp/billingfe.tar.gz",
            "systemctl restart billing-frontend-runtime-fetch",
            "echo 'set \$billing_version \"$FE_VERSION\";' > /etc/nginx/snippets/billing-frontend-runtime-version.conf",
            "nginx -t && systemctl reload nginx",
            "chown -R django:www-data $APP && chmod -R g-w,o-rwx $APP"
          ], "executionTimeout": ["900"] }
          EOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy billing-frontend ${{ github.sha }}" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Attendre la fin de la commande SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          CMD_ID: ${{ steps.ssm.outputs.cmd_id }}
        run: |
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text; exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy $STATUS"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
                exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          echo "Timed out"; exit 1

      - name: Smoke test
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 30 -I https://billing.foxugly.com/ > /dev/null; then
              echo "Deployment OK (attempt $attempt)"; exit 0
            fi
            echo "attempt $attempt failed, retrying in 5s..."; sleep 5
          done
          echo "Smoke test failed"; exit 1
