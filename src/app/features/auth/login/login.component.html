<app-auth-card icon="pi pi-sign-in" [title]="'login.title' | transloco">
  <form [formGroup]="form" (ngSubmit)="magicMode() ? sendMagic() : submit()" class="login-form">
    <div class="login-field">
      <label for="login-email">{{ 'login.email' | transloco }}</label>
      <input pInputText id="login-email" type="email" formControlName="email" autocomplete="email" />
    </div>

    @if (!magicMode()) {
      <div class="login-field">
        <label for="login-password">{{ 'login.password' | transloco }}</label>
        <p-password
          inputId="login-password"
          formControlName="password"
          [toggleMask]="true"
          [feedback]="false"
          styleClass="login-password"
          autocomplete="current-password"
        />
      </div>

      <div class="login-meta">
        <p-checkbox inputId="login-remember" formControlName="remember" [binary]="true" />
        <label for="login-remember" class="login-remember">{{ 'login.remember' | transloco }}</label>
        <button type="button" class="login-link" (click)="stub()">{{ 'login.forgot' | transloco }}</button>
      </div>

      <p-button
        type="submit"
        [label]="'login.submit' | transloco"
        icon="pi pi-sign-in"
        styleClass="login-submit"
      />

      <div class="auth-divider"><span>{{ 'login.or' | transloco }}</span></div>

      <p-button
        type="button"
        [label]="'login.magic' | transloco"
        icon="pi pi-envelope"
        [outlined]="true"
        styleClass="login-submit"
        (onClick)="toggleMagic()"
      />
    } @else {
      <p-button
        type="submit"
        [label]="'login.magic_submit' | transloco"
        icon="pi pi-envelope"
        styleClass="login-submit"
      />
      <button type="button" class="login-link login-link--center" (click)="toggleMagic()">
        {{ 'common.cancel' | transloco }}
      </button>
    }
  </form>

  <p class="login-alt">
    {{ 'login.no_account' | transloco }}
    <button type="button" class="login-link" (click)="stub()">{{ 'login.register' | transloco }}</button>
  </p>

  <p class="login-hint">{{ 'login.demo_hint' | transloco }}</p>
</app-auth-card>
