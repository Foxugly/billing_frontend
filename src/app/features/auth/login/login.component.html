<!--
  Console d'exploitation : PAS d'inscription, PAS de mot de passe oublié, PAS de
  lien magique. Le backend refuse tout compte non-staff et les comptes sont créés
  par `createsuperuser`. Afficher ces parcours donnerait à croire qu'ils existent.
-->
<app-auth-card icon="pi pi-sign-in" [title]="'login.title' | transloco">
  <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
    <div class="login-field">
      <label for="login-email">{{ 'login.email' | transloco }}</label>
      <input pInputText id="login-email" type="email" formControlName="email" autocomplete="email" />
    </div>

    <div class="login-field">
      <label for="login-password">{{ 'login.password' | transloco }}</label>
      <p-password
        inputId="login-password"
        formControlName="password"
        [toggleMask]="true"
        [feedback]="false"
        styleClass="login-password"
        autocomplete="current-password"
      />
    </div>

    <div class="login-meta">
      <p-checkbox inputId="login-remember" formControlName="remember" [binary]="true" />
      <label for="login-remember" class="login-remember">{{ 'login.remember' | transloco }}</label>
    </div>

    <p-button
      type="submit"
      [label]="'login.submit' | transloco"
      icon="pi pi-sign-in"
      styleClass="login-submit"
      [loading]="submitting()"
    />
  </form>

  <p class="login-hint">{{ 'login.staff_only' | transloco }}</p>
</app-auth-card>
