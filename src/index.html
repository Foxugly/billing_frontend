<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Foxugly Billing</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#10b981">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/png" sizes="32x32" href="logo-32.png">
  <link rel="apple-touch-icon" href="logo.png">
  <script data-theme-init>
    // Anti-FOUC : pose .dark-mode sur <html> AVANT le bootstrap Angular pour
    // éviter le flash de thème clair au rechargement (standard flotte).
    (function () {
      try {
        var t = localStorage.getItem('theme');
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark-mode');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
